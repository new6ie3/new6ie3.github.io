about_content: |
  저는 게임 시스템에 관심이 많은 클라이언트 개발자 박승연입니다.<br>
  개발 성능 최적화에 관심을 갖고 노력하고 있습니다.<br>

  팀 프로젝트 경험을 통해 의사소통 능력을 갖추었습니다.<br>
  문제가 발생했을 때 팀원과 상담하고 빠르게 해결하도록 노력하고 있습니다.<br>

  한라대학교 IT소프트웨어 학과 학사<br>
  성적 3.98<br>

about_more_content: |
 저는 고민하면서 도전합니다. 낮선 일에 발딛는 것은 두렵지만, 내가 하지 않으면 아무도 대신해주지 않는다고 생각합니다.<br>
 낯선 일에 첫발을 내딛는 것은 두렵지만, 누군가 대신해 주기를 기다리기보다<br> 직접 부딪히며 경험하는 것을 중요하게 생각합니다.<br>
 개발하면서 제가 작성한 코드가 마음에 들지 않을 때도 많습니다.<br> 그럴 때 단순히 동작하는 것에 만족하기보다,<br> 왜 마음에 들지 않는지 고민하고 더 나은 방법을 찾으려 노력합니다.<br><br>
 모르는 기술을 마주했을 때도 피하기보다 직접 사용해 보고,<br> 문제가 생기면 원인을 찾아 해결하는 과정을 반복해 왔습니다.<br><br>
 이러한 끊임없는 고민과 새로운 것에 도전하는 자세가 저의 강점이라고 생각합니다.
 
 ## 개발 경험

  Unity를 활용한 TPS 프로젝트에서 플레이어 조작,
  전투 시스템, 캐릭터 리깅 등을 구현했습니다.

 ## 협업 경험

  대학 팀 프로젝트를 진행했을때, 팀원들과 어떻게 개발상황을 공유하고 역할분담을 할지 고민이 많았습니다.<br>
  과거의 진행한 팀 프로젝트가 원활히 진행되지 않았던 적이 있었습니다.<br>
  개개인이 해야하는 일이 제대로 정해지지 않았고, 이는 프로젝트 실패를 경험하게 했습니다.<br>
  이 경험으로 의사소통이 중요하고 나온 결과물의 퀄리티도 좋아진다는 것을 깨달았습니다.<br>
  체크리스트를 만들어 역할분담을 명확하게 하고 각자 파트의 데드라인을 정하여 개발이 늦어지지 않도록 해결하였습니다.<br>
  1주일에는 한번씩 모여 종합회의를 진행하였습니다.<br>
  문제가 발생했을때 팀원과 의견을 공유하고 해결 방법을 찾는 과정이 중요하다고 생각하다고 느꼈습니다.<br>
  
  ![alt text](/images/com.jpg "Com")
  
 ## 관심 분야

  게임 시스템 구현과 성능 최적화에 관심이 있으며,
  유지보수가 쉽고 확장 가능한 구조를 만들기 위해 노력하고 있습니다.



  
