content:
  - title: Portfolio
    layout: projects
    content:

      - layout: left
        border: weak
        title: Zero Vector
        image: /images/projects/ZeroVector01.jpg

        tags:
          - Unity
          - C#

        quote: >
          Unity TPS 멀티 프로젝트

        description: |
          Unity 3D환경으로 제작한 TPS 팀 프로젝트입니다.
          팀원 간 역할 분담과 협업으로 공동 개발 역량을 강화했습니다.

        sections:
          - title: 주요 기능 및 기여
            content: |
              - 플레이어 조작 시스템
              - 탄약 및 재장전 시스템
              - 피격 판정
              - 캐릭터 리깅

          - title: 기술적으로 고민한 부분
            content: |
              총알을 Instantiate와 Destroy로 반복 생성할 경우
              불필요한 메모리 할당과 해제가 발생했습니다.

              이를 해결하기 위해 Object Pooling을 적용했습니다.


