about_more_content: |
  ## 고민하며 도전하는 개발자

  저는 고민하면서 도전합니다.<br>
  낯선 일에 첫발을 내딛는 것은 두렵지만, 누군가 대신해 주기를 기다리기보다<br>
  직접 부딪히며 경험하는 것을 중요하게 생각합니다.<br>
  <br>

  개발하면서 제가 작성한 코드가 마음에 들지 않을 때도 많습니다.<br>
  그럴 때 단순히 동작하는 것에 만족하기보다,<br>
  왜 마음에 들지 않는지 고민하고 더 나은 방법을 찾으려 노력합니다.<br>
  <br>

  모르는 기술을 마주했을 때도 피하기보다 직접 사용해 보고,<br>
  문제가 생기면 원인을 찾아 해결하는 과정을 반복해 왔습니다.<br>
  <br>

  이러한 끊임없는 고민과 새로운 것에 도전하는 자세가 저의 강점이라고 생각합니다.<br>
  <br>

  ## Communication

  대학 팀 프로젝트를 진행하면서 팀원들과 개발 상황을 어떻게 공유하고,
  역할을 어떻게 분담할지 고민한 경험이 있습니다.<br>
  <br>

  과거에 역할 분담이 명확하지 않아 프로젝트가 원활하게 진행되지 않았던 경험이 있습니다.<br>
  각자가 해야 할 일이 명확하게 정해지지 않았고,
  결국 프로젝트를 제대로 마무리하지 못했습니다.<br>
  이를 통해 팀 프로젝트에서는 개인의 개발 능력뿐만 아니라
  **역할 분담과 지속적인 의사소통이 중요하다는 것을 배웠습니다.**<br>
  <br>

  이후 팀 프로젝트에서는 체크리스트를 만들어 역할을 명확하게 나누고,
  각 파트의 데드라인을 정해 개발 일정이 늦어지지 않도록 관리했습니다.<br>
  또한 일주일에 한 번씩 팀원들과 회의를 진행하여
  각자의 개발 상황과 발생한 문제를 공유했습니다.<br>
  <br>

  이 경험을 통해 문제가 발생했을 때 혼자 해결하려 하기보다,
  팀원들과 상황을 공유하고 함께 해결 방법을 찾는 과정이
  프로젝트를 완성하는 데 중요하다는 것을 배웠습니다.<br>

  ![팀 프로젝트 협업](/images/com.jpg "Communication")


  ## 관심 분야

  게임 시스템 구현과 성능 최적화에 관심이 있습니다.<br>
  단순히 기능이 동작하는 것에 그치지 않고,
  유지보수와 확장을 고려한 구조를 만들기 위해 노력하고 있습니다.



