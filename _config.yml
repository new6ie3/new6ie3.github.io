about_content: |
  저는 게임시스템에 관심이 많은 클라이언트 개발자 박승연입니다.<br>
  개발 성능 최적화에 관심을 갖고 노력하고 있습니다.<br>

  팀 프로젝트 경험을 통해 의사소통 능력을 갖추었습니다.<br>
  문제가 발생했을 때 팀원과 상담하고 빠르게 해결하도록 노력하고 있습니다.<br>

  한라대학교 IT소프트웨어 학과 학사<br>
  성적 3.98<br>

about_more_content: |
  ## 개발 경험

  Unity를 활용한 TPS 프로젝트에서 플레이어 조작,
  전투 시스템, 캐릭터 리깅 등을 구현했습니다.

  ## 협업 경험

  팀 프로젝트를 진행하며 역할 분담과 Git을 통한 협업을 경험했습니다.

  문제가 발생했을 때 팀원과 의견을 공유하고
  해결 방법을 찾는 과정을 중요하게 생각합니다.

  ## 관심 분야

  게임 시스템 구현과 성능 최적화에 관심이 있으며,
  유지보수가 쉽고 확장 가능한 구조를 만들기 위해 노력하고 있습니다.

  
